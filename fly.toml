# Fewer on Fly.io. One image, two process groups. Steps: docs/DEPLOY.md.
# `app` is a placeholder: app names are global on Fly, so change it to something free.
app = "fewer"
primary_region = "sjc"

# Fly's default stop signal is SIGINT; both Next and scripts/worker.ts handle SIGTERM cleanly.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

# Commands replace the Dockerfile CMD. `npm run start -- ...` is `next start ...`.
[processes]
  web = "npm run start -- -p 3000 -H 0.0.0.0"
  worker = "npx tsx scripts/worker.ts"

# Public HTTP: web only. The worker has no [services], so it never receives traffic
# and Fly never auto-stops it.
[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # /login is the one page the password gate always leaves open, so it works as a health probe.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/login"

# Next + Mastra + the AI SDK need more than the 256MB default.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]

# The worker must come back whenever it exits; it has no other supervisor.
[[restart]]
  policy = "always"
  processes = ["worker"]

[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["web"]

# Rolling replaces a machine in place (stop old, start new), so a single worker is never
# duplicated mid-deploy. Do NOT switch to bluegreen/canary: those briefly run two workers.
[deploy]
  strategy = "rolling"
